name: pipeline

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Run pipeline
        run: npm run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CCF_MAX_DRAFTS_PER_RUN: ${{ vars.CCF_MAX_DRAFTS_PER_RUN }}

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'pipeline: draft framework updates'
          title: 'Pipeline: Draft framework updates'
          body: |
            Automated pipeline output.

            Guardrails:
            - No automatic publish
            - Human review required before setting status: published

            Review checklist:
            - Confirm scope and non-claims
            - Confirm sources are appropriate
            - Confirm safety gate outcomes
          branch: codex/pipeline-${{ github.run_id }}
          delete-branch: true
          labels: pipeline
